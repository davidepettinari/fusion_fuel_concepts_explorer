[build-system]
requires = ["setuptools>=60", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion_fuel_concepts_explorer"
version = "0.0.1"
authors = [
  { name="Davide Pettinari, Alessandro Morandi", email="davide.pettinari@polito.it" }
]

description = "Fusion Fuel Concepts Explorer"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "openmc",
    "numpy",
    "scipy",
    "pandas",
    "tables",
    "tokamak_radiation_environment",
]

[project.urls]
"Homepage" = "https://github.com/davidepettinari/fusion_fuel_concepts_explorer"
"Bug Tracker" = "https://github.com/davidepettinari/fusion_fuel_concepts_explorer/issues"
